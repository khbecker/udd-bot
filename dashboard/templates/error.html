<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kernel Team Package Status — Error | Ubuntu</title>
<link rel="icon" type="image/png" sizes="32x32"
      href="https://assets.ubuntu.com/v1/be7e4cc6-COF-favicon-32x32.png">
<link rel="stylesheet" type="text/css" media="screen"
      href="https://ubuntu.com/static/css/styles.css?v=9015880">
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>

<body class="is-paper">

<header id="navigation" class="p-navigation is-dark">
  <div class="p-navigation__row--25-75">
    <div class="p-navigation__banner">
      <div class="p-navigation__tagged-logo">
        <a class="p-navigation__link" href="/">
          <div class="p-navigation__logo-tag">
            <img class="p-navigation__logo-icon"
                 src="https://assets.ubuntu.com/v1/82818827-CoF_white.svg" alt="">
          </div>
          <span class="p-navigation__logo-title">Kernel packages</span>
        </a>
      </div>
    </div>
  </div>
</header>

<main id="main-content">
<section class="p-section--hero">
  <div class="u-fixed-width">
    <h1>Could not load package status</h1>
    <div class="p-notification--negative">
      <div class="p-notification__content">
        <h5 class="p-notification__title">No data available</h5>
        <p class="p-notification__message">
          The dashboard could not fetch data and has no cached copy to fall
          back on.
        </p>
      </div>
    </div>
    <pre class="k-prompt">{{ error }}</pre>
    <p>
      Check that the UDD mirror is reachable
      (<code>udd-mirror.debian.net:5432</code>) and that
      <code>package-list.txt</code> exists.
    </p>
    <a class="p-button--positive" href="/">Retry</a>
  </div>
</section>
</main>

</body>
</html>
